# XcodeGen spec. On a Mac: `brew install xcodegen && xcodegen generate`, then open Rota.xcodeproj.
# The generated .xcodeproj is git-ignored; this file is the source of truth.
name: Rota
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RotaCore:
    type: framework
    platform: iOS
    sources: [RotaCore]
    info:
      path: RotaCore/Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.rota.core
        APPLICATION_EXTENSION_API_ONLY: YES   # shared with the widget extension
  Rota:
    type: application
    platform: iOS
    sources:
      - path: Rota
        excludes: ["Rota.storekit"]
    dependencies:
      - target: RotaCore
        embed: true
    entitlements:
      path: Rota/Rota.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yourname.rota]
    info:
      path: Rota/Info.plist
      properties:
        CFBundleDisplayName: Rota
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.rota
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
  RotaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RotaTests
      - path: Rota/Rota.storekit
        buildPhase: resources
    info:
      path: RotaTests/Info.plist
      properties: {}
    dependencies:
      - target: RotaCore
      - target: Rota
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.rota.tests
schemes:
  Rota:
    build:
      targets:
        Rota: all
        RotaCore: all
        RotaTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Rota/Rota.storekit
    test:
      config: Debug
      targets: [RotaTests]
