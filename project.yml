# XcodeGen spec. On a Mac: `brew install xcodegen && xcodegen generate`, then open Rota.xcodeproj.
# The generated .xcodeproj is git-ignored; this file is the source of truth.
name: Rota
options:
  bundleIdPrefix: com.rotashift
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    majorVersion: 3.0.0
settings:
  base:
    SWIFT_VERSION: "5"
    POSTHOG_API_KEY: ""            # set per build (CI secret / xcconfig); empty disables analytics
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RotaCore:
    type: framework
    platform: iOS
    sources: [RotaCore]
    info:
      path: RotaCore/Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rotashift.rota.core
        APPLICATION_EXTENSION_API_ONLY: YES   # shared with the widget extension
  Rota:
    type: application
    platform: iOS
    sources:
      - path: Rota
        excludes: ["Rota.storekit"]
    dependencies:
      - target: RotaCore
        embed: true
      - target: RotaWidget
      - package: PostHog
    entitlements:
      path: Rota/Rota.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rotashift.rota]
    info:
      path: Rota/Info.plist
      properties:
        CFBundleDisplayName: Rota
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: Rota adds your shifts to a calendar of its own. It never changes your other calendars.
        PostHogAPIKey: $(POSTHOG_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rotashift.rota
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RotaWidget:
    type: app-extension
    platform: iOS
    sources:
      - RotaWidget
      - path: Rota/Design        # shared design tokens; same files, both targets
    dependencies:
      - target: RotaCore
        embed: false             # the app embeds RotaCore; the extension links it
    entitlements:
      path: RotaWidget/RotaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rotashift.rota]
    info:
      path: RotaWidget/Info.plist
      properties:
        CFBundleDisplayName: Rota
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rotashift.rota.widget
        SKIP_INSTALL: YES
  RotaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RotaTests
      - path: Rota/Rota.storekit
        buildPhase: resources
    info:
      path: RotaTests/Info.plist
      properties: {}
    dependencies:
      - target: RotaCore
      - target: Rota
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rotashift.rota.tests
schemes:
  Rota:
    build:
      targets:
        Rota: all
        RotaCore: all
        RotaWidget: all
        RotaTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Rota/Rota.storekit
    test:
      config: Debug
      targets: [RotaTests]
