name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.rotashift.rota

jobs:
  build-and-test:
    name: Build, test and screenshot (iPhone simulator)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # Attach the StoreKit configuration to the scheme's Test action as well as Run, so
          # the test host runs against the local StoreKit environment (XcodeGen only sets Run).
          python3 - <<'PY'
          import re
          path = "Rota.xcodeproj/xcshareddata/xcschemes/Rota.xcscheme"
          scheme = open(path).read()
          match = re.search(r'<StoreKitConfigurationFileReference.*?(/>|</StoreKitConfigurationFileReference>)', scheme, re.S)
          ref = match.group(0) if match else '<StoreKitConfigurationFileReference\n         identifier = "../../Rota/Rota.storekit">\n      </StoreKitConfigurationFileReference>'
          if "</TestAction>" in scheme and scheme.count("<StoreKitConfigurationFileReference") < 2:
              scheme = scheme.replace("</TestAction>", "      " + ref + "\n   </TestAction>", 1)
              open(path, "w").write(scheme)
              print("Patched TestAction with:", ref)
          else:
              print("TestAction not patched")
          PY
          grep -n -A2 "StoreKitConfigurationFileReference" Rota.xcodeproj/xcshareddata/xcschemes/Rota.xcscheme

      - name: Pick a simulator
        id: sim
        run: |
          # Newest available iPhone simulator on this image, e.g. "iPhone 17".
          JSON=$(xcrun simctl list devices available --json)
          NAME=$(echo "$JSON" \
            | jq -r '.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | .name' \
            | grep -E '^iPhone [0-9]+$' | sort -V | tail -1)
          UDID=$(echo "$JSON" \
            | jq -r --arg n "$NAME" '.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name == $n) | .udid' \
            | head -1)
          echo "Using simulator: $NAME ($UDID)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Grant calendar access to the test host
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl privacy "$UDID" grant calendar "$BUNDLE_ID" || echo "privacy grant failed (tests will skip)"

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Rota.xcodeproj \
            -scheme Rota \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}" \
            | xcbeautify --renderer github-actions
          # Ad-hoc ("-") signing on the simulator embeds the App Group entitlement, which SwiftData requires.

      - name: Screenshots (demo data; test device, largest iPhone, and iPhone SE)
        if: always()
        run: |
          APP=$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "Rota.app" | head -1)
          if [ -z "$APP" ]; then echo "No Rota.app built; skipping screenshots"; exit 0; fi
          JSON=$(xcrun simctl list devices available --json)
          ios_devices () { echo "$JSON" | jq -r '.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | "\(.name)\t\(.udid)"'; }
          # Release checklist sizes: the largest Pro Max and the iPhone SE, plus the test device.
          PROMAX=$(ios_devices | grep -E "^iPhone [0-9]+ Pro Max" | sort -V | tail -1)
          SE=$(ios_devices | grep -E "^iPhone SE" | sort -V | tail -1)
          TEST="${{ steps.sim.outputs.name }}	${{ steps.sim.outputs.udid }}"
          mkdir -p screenshots
          shoot_device () {  # shoot_device <dir> <udid>
            local dir=$1 udid=$2
            echo "== $dir ($udid)"
            xcrun simctl boot "$udid" 2>/dev/null || true
            xcrun simctl bootstatus "$udid" -b
            # UK phone: en_GB locale gives a Monday week start and 24-hour times.
            xcrun simctl spawn "$udid" defaults write "Apple Global Domain" AppleLocale -string en_GB
            xcrun simctl spawn "$udid" defaults write "Apple Global Domain" AppleLanguages -array en-GB
            xcrun simctl shutdown "$udid" && xcrun simctl boot "$udid" && xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$APP"
            mkdir -p "screenshots/$dir"
            shot () {  # shot <file> <appearance> [launch args...]
              local file=$1 mode=$2; shift 2
              xcrun simctl ui "$udid" appearance "$mode"
              xcrun simctl terminate "$udid" "$BUNDLE_ID" 2>/dev/null || true
              xcrun simctl launch "$udid" "$BUNDLE_ID" "$@"
              sleep 6
              xcrun simctl io "$udid" screenshot "screenshots/$dir/$file"
            }
            shot month-light.png light --demo
            shot month-dark.png dark --demo
            shot builder-light.png light --demo --demo-builder
            shot day-light.png light --demo --demo-day
            shot settings-light.png light --demo --demo-settings
            shot paywall-light.png light --demo --demo-paywall
            shot empty-light.png light
            xcrun simctl shutdown "$udid" || true
          }
          for entry in "$TEST" "$PROMAX" "$SE"; do
            [ -z "$entry" ] && continue
            name=$(echo "$entry" | cut -f1); udid=$(echo "$entry" | cut -f2)
            shoot_device "$(echo "$name" | tr ' ()' '_' | tr -s '_')" "$udid"
          done
          find screenshots -name "*.png" | sort

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
